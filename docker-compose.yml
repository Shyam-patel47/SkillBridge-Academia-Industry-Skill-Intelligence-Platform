version: "3.8"

services:
  # ------------------------------------------
  # SkillBridge Core Intelligence Backend
  # ------------------------------------------
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: skillbridge-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_PREFIX=/api/v1
      - CLIENT_URL=http://localhost
      - DATABASE_URL=${DATABASE_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-strong-32-char-production-access-secret-key-123}
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-strong-32-char-production-refresh-secret-key-123}
      - JWT_REFRESH_EXPIRES_IN=7d
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ------------------------------------------
  # SkillBridge React + Nginx Frontend
  # ------------------------------------------
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: skillbridge-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
